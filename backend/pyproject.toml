[project]
name = "phenoctx"
version = "0.1.0"
description = "Explore how explicit judgments change a diabetes cohort."
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phenoctx"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
